apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: "{{ gitops_agent_namespace }}"
spec:
  project: "{{ gitops_app_project }}"
  source:
    repoURL: "{{ git_src }}"
    path: 2-infra/clusters/{{ cluster_name }}
  destination:
    server: "https://kubernetes.default.svc"