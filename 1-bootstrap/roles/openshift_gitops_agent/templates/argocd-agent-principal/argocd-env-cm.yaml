---
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-variables
  namespace: "{{ gitops_instance_namespace }}"
data:
  KUSTOMIZE_PLUGIN_HOME: /etc/kustomize/plugin
  CLUSTER_NAME: '{{ ocp_cluster_name }}'
  CLUSTER_BASE_DOMAIN: '{{ ocp_base_domain }}'
          # all created clusters base domain should be <cluster-name>.<PLATFORM_BASE_DOMAIN>
  PLATFORM_BASE_DOMAIN: '{{ ocp_platform_domain }}'
  INFRA_GITOPS_REPO: '{{ git_src }}'
