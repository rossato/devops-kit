---
- hosts: localhost
  vars:
    cluster_name: ocp-sno.lab.home
    git_src: git@github.com:rossato/devops-kit.git
    disconnected: false
    agent_mode: true
  gather_facts: false
  tasks:
    - import_role:
        name: openshift_disconnected
        tasks_from: deploy.yml
      when: disconnected
    - import_role:
        name: openshift_cert_manager
        tasks_from: direct_deploy.yml
      when: agent_mode
    - import_role:
        name: openshift_gitops_agent
        tasks_from: deploy.yml
      when: agent_mode
    - import_role:
        name: openshift_gitops
        tasks_from: deploy.yml
      when: not agent_mode
