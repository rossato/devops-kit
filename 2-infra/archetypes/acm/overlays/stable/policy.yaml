apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: operators-all-stable
placementBindingDefaults:
  name: operators-stable
policyDefaults:
  namespace: open-cluster-management-global-set
  placement:
    labelSelector:
      matchExpressions:
        - key: operator-lifecycle
          operator: In
          values:
            - stable
  generatePlacementWhenInSet: true
  policySets:
  - operators-stable
policies:
  - name: cert-manager-stable
    disabled: false
    manifests:
      - path: cert-manager